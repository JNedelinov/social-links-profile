<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- displays site properly based on user's device -->
    <link
      rel="icon"
      type="image/png"
      sizes="32x32"
      href="./assets/images/favicon-32x32.png"
    />
    <link rel="stylesheet" href="/styles/style.css" />
    <title>Frontend Mentor | Social links profile</title>
    <style>
      .attribution {
        font-size: 11px;
        text-align: center;
      }
      .attribution a {
        color: hsl(228, 45%, 44%);
      }
    </style>
  </head>
  <body>
    <div class="main">
      <div class="card-container">
        <div class="card">
          <div class="profile">
          <div class="avatar">
            <img src="assets/images/avatar-jessica.jpeg" alt="User's avatar" />
          </div>
          <div class="bio">
            <p class="name">Jessica Randall</p>
            <p class="location">London, United Kingdom</p>
          </div>
          <p class="description">"Front-end developer and avid reader."</p>
          </div>
          <ul class="links">
            <li class="link">
              <a href="#">GitHub</a>
            </li>
            <li class="link">
              <a href="#">Frontend Mentor</a>
            </li>
            <li class="link">
              <a href="#">LinkedIn</a>
            </li>
            <li class="link">
              <a href="#">Twitter</a>
            </li>
            <li class="link">
              <a href="#">Instagram</a>
            </li>
          </ul>
        </div>
      </div>
      <div class="attribution">
        Challenge by
        <a href="https://www.frontendmentor.io?ref=challenge" target="_blank"
          >Frontend Mentor</a
        >. Coded by <a href="https://www.frontendmentor.io/profile/JNedelinov">JNedelinov</a>.
      </div>
    </div>
  </body>
</html>
